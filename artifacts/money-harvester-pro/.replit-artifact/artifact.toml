kind = "web"
previewPath = "/"
title = "Money Harvester Pro"
description = "A production-shaped live trading control room for MetaApi-connected broker accounts, with real leverage, risk gates, market structure states, execution safeguards, equity history, and diagnostics."
version = "1.0.0"
id = "artifacts/money-harvester-pro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19354

[services.development]
run = "pnpm --filter @workspace/money-harvester-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/money-harvester-pro", "run", "build" ]
serve = "static"
publicDir = "artifacts/money-harvester-pro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19354"
BASE_PATH = "/"
